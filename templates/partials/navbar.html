<nav>
	<div class="nav-inner">
		<a href="/" class="logo" aria-label="GameCrew home">GAMECREW</a>

		<div class="nav-games-shell">
			<button type="button" class="nav-scroll-btn nav-scroll-left" data-action="scroll-nav-left" aria-label="Scroll games left"><img src="/static/img/icons/nav-arrow-left.svg" alt="" aria-hidden="true" width="16" height="16"></button>

			<div class="nav-games-track" id="nav-games-track" aria-label="Game shortcuts">
				{% if profile and profile.favorite_games %}
				{% for game in profile.favorite_games %}
				<a href="/game/{{ game.slug }}" class="nav-game-link" aria-label="{{ game.name }}">
					<img src="{{ game.image_url }}" alt="{{ game.name }}">
				</a>
				{% endfor %}
				{% endif %}
			</div>

			<button type="button" class="nav-scroll-btn nav-scroll-right" data-action="scroll-nav-right" aria-label="Scroll games right"><img src="/static/img/icons/nav-arrow-right.svg" alt="" aria-hidden="true" width="16" height="16"></button>
		</div>

		<div class="user-area">
			{% if profile %}
			<a href="/profile/{{ profile.username }}" class="user-profile-link" aria-label="Open your profile">
				<div>
					<div class="user-name">{{ profile.username }}</div>
				</div>
				<div class="user-avatar">
					<img src="{{ profile.avatar_url }}" alt="{{ profile.username }} avatar">
				</div>
			</a>
			<a href="/friends" class="nav-friends-btn" aria-label="Friends" title="Friends">
				<span class="nav-friends-icon" aria-hidden="true"></span>
				{% if profile.pending_requests and profile.pending_requests > 0 %}
				<span class="nav-friends-badge" aria-label="{{ profile.pending_requests }} pending requests">{{ profile.pending_requests }}</span>
				{% endif %}
			</a>
			<a href="/settings" class="nav-cog-btn" aria-label="Open settings" title="Settings"></a>
			{% else %}
			<button type="button" class="login-btn" data-action="go-login">Sign in</button>
			{% endif %}
		<button type="button" class="theme-toggle-btn" data-action="toggle-theme" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
			<img class="theme-icon-moon" src="/static/img/icons/icon-moon.svg" alt="" aria-hidden="true" width="18" height="18">
			<img class="theme-icon-sun" src="/static/img/icons/icon-sun.svg" alt="" aria-hidden="true" width="18" height="18">
		</button>
		</div>
	</div>
</nav>
