<nav>
	<div class="nav-inner">
		<a href="/" class="logo" aria-label="GameCrew home">GAMECREW</a>

		<div class="nav-games-shell">
			<button type="button" class="nav-scroll-btn nav-scroll-left" onclick="scrollNavGames(-1)" aria-label="Scroll games left">‹</button>

			<div class="nav-games-track" id="nav-games-track" aria-label="Game shortcuts">
				{% for game in profile.favorite_games %}
				<a href="/game/{{ game.slug }}" class="nav-game-link" aria-label="{{ game.name }}">
					<img src="{{ game.image_url }}" alt="{{ game.name }}">
				</a>
				{% endfor %}
			</div>

			<button type="button" class="nav-scroll-btn nav-scroll-right" onclick="scrollNavGames(1)" aria-label="Scroll games right">›</button>
		</div>

		<div class="user-area">
			{% if profile %}
			<a href="/profile/{{ profile.username }}" class="user-profile-link" aria-label="Open your profile">
				<div>
					<div class="user-name">{{ profile.username }}</div>
					<div class="user-tag">{{ profile.user_tag }}</div>
				</div>
				<div class="user-avatar">
					<img src="{{ profile.avatar_url }}" alt="{{ profile.username }} avatar">
				</div>
			</a>
			<a href="/friends" class="nav-friends-btn" aria-label="Friends" title="Friends">
				<span class="nav-friends-icon" aria-hidden="true"></span>
				{% if profile.pending_requests and profile.pending_requests > 0 %}
				<span class="nav-friends-badge" aria-label="{{ profile.pending_requests }} pending requests">{{ profile.pending_requests }}</span>
				{% endif %}
			</a>
			<a href="/settings" class="nav-cog-btn" aria-label="Open settings" title="Settings">⚙</a>
			{% else %}
			<button type="button" class="login-btn" onclick="goLogin()">Sign in</button>
			{% endif %}
		</div>
	</div>
</nav>
