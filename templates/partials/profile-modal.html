<!-- Profile modal -->
<div id="profile-card" class="profile-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true">
	<div class="profile-card profile-card-modal">
		<button class="close-btn" onclick="closeProfile()" aria-label="Close profile">×</button>
		<div id="profile-loading" class="profile-loading">Loading profile…</div>
		<div class="games-panel" aria-label="Favorite games"></div>
		<div class="profile-panel">
			<div class="profile-avatar">
				<img src="/static/img/profiles/default.jpg" alt="Profile avatar">
			</div>
			<div class="info-box">
				<div class="info-box-title">Player Info</div>
				<div class="bio-text"></div>
			</div>
			<div class="profile-buttons"></div>
		</div>
	</div>
</div>
