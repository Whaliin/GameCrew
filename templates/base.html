<!DOCTYPE html>
<html lang="en" {% if theme %}data-theme="{{ theme }}"{% endif %}>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}GameCrew{% endblock %}</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/static/css/style.css">
	<link rel="icon" type="image/svg+xml" href="/static/img/icons/favicon.svg">
	{% block extra_head %}{% endblock %}
</head>
<body>
	{% block content %}{% endblock %}
	<footer class="lp-footer">
		// GameCrew · Group 8 · 2026
	</footer>
	<script src="/static/js/app.js"></script>
	{% block extra_scripts %}{% endblock %}
</body>
</html>
